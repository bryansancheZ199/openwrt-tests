openwrt:
  name: Raspberry Pi 3A+/3B/3B+/CM3/Zero2/Zero2W/CM0 (64bit)
  target: bcm27xx-bcm2710
  profile: rpi-3
targets:
  main:
    resources:
      RemotePlace:
        name: !template "$LG_PLACE"
      NetworkService:
        address: "192.168.1.1"
        port: 22
        username: root
    drivers:
      NetworkPowerDriver: {}
      SerialDriver:
        txdelay: 0.05
      ShellDriver:
        prompt: 'root@[\w()]+:[^ ]+ '
        login_prompt: Please press Enter to activate this console.
        await_login_timeout: 15
        login_timeout: 120
        post_login_settle_time: 5
        username: root
      USBSDMuxDriver: {}
      USBStorageDriver:
        image: "firmware"
      ShellStrategy: {}
      SSHDriver:
        connection_timeout: 120.0
        explicit_scp_mode: True
